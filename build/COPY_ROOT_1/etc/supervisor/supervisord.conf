# FORK OVERRIDE (bbaaxx/aidock-comfyui): upstream binds the unauthenticated
# inet_http_server (XML-RPC + web UI: read logs, restart/stop services) to
# 0.0.0.0. Nothing in the stack uses it (supervisorctl talks to the unix
# socket). Bind loopback only.

[unix_http_server]
file=/var/run/supervisor.sock
chmod = 0700
username = ai-dock
password = ai-dock

[supervisord]
logfile=/var/log/supervisor/supervisor.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=/var/run/supervisord.pid
nodaemon=true
minfds=1024 
minprocs=200
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[inet_http_server]
port = 127.0.0.1:9001

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock
username = ai-dock
password = ai-dock

[include]
files = /etc/supervisor/supervisord/conf.d/*.conf

