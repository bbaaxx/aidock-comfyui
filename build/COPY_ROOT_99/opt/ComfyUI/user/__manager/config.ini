# ComfyUI-Manager pre-seeded config (this fork).
# security_level=strong: no pip/git-install or other privileged actions via
# the remote API. share_option=none: no usage telemetry to Manager infra.
# Manager only writes this file when missing; user edits on pod persist.
[default]
preview_method = none
git_exe = 
use_uv = True
channel_url = https://raw.githubusercontent.com/ltdrdata/ComfyUI-Manager/main
share_option = none
bypass_ssl = False
file_logging = True
component_policy = workflow
update_policy = stable-comfyui
windows_selector_event_loop_policy = False
model_download_by_agent = False
downgrade_blacklist = 
security_level = strong
always_lazy_install = False
network_mode = public
db_mode = cache
allow_git_url_install = False
allow_pip_install = False
