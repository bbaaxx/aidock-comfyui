name: Docker Build

on:
  workflow_dispatch:
  #push:
  #  branches: [ "main" ]

env:
  UBUNTU_VERSION: 22.04
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1
  # ComfyUI v0.27+ pins comfy-kitchen>=0.2.16 which uses PEP 585 annotations
  # (list[int]) in torch custom ops; torch supports those from 2.7.0.
  # Three nvidia tiers, picked by HOST DRIVER version:
  #   cu121 (driver >=530, torch 2.5.1):  legacy, ComfyUI capped at v0.26.2
  #   cu128 (driver >=570.86, torch 2.11): v0.33.1 - most community hosts
  #   cu130 (driver >=580.65, torch 2.13): v0.33.1 - newest hosts (latest-cuda)
  # torchaudio/xformers skipped on cu128/cu130: no wheels, ComfyUI needs neither.


jobs:
  cpu-base:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build:
          - {latest: "false", comfyui: "v0.26.2", python: "3.10", pytorch: "2.5.1"}
    steps:
      -
        name: Free Space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h
      -
        name: Env Setter
        run: |
          REPO=${GITHUB_REPOSITORY,,}
          echo "REPO_NAMESPACE=${REPO%%/*}" >> ${GITHUB_ENV}
          echo "REPO_NAME=${REPO#*/}" >> ${GITHUB_ENV}
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Permissions fixes
        run: |
          target="${HOME}/work/${{ env.REPO_NAME }}/${{ env.REPO_NAME }}/build/COPY*"
          chmod -R ug+rwX ${target}
      -
        name: Login to DockerHub
        if: ${{ vars.DOCKERHUB_USER != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Set tags
        run: |
            img_path_ghcr="ghcr.io/${{ env.REPO_NAMESPACE }}/${{ env.REPO_NAME }}"
            if [[ -z '${{ matrix.build.comfyui }}' ]]; then
                COMFYUI_BUILD_REF="$(curl -fsSL https://api.github.com/repos/Comfy-Org/ComfyUI/tags | jq -r '.[0].name')"
            else
                COMFYUI_BUILD_REF="${{ matrix.build.comfyui }}"
            fi
            [ -z "$COMFYUI_BUILD_REF" ] && { echo "Error: COMFYUI_BUILD_REF is empty. Exiting script." >&2; exit 1; }
            echo "COMFYUI_BUILD_REF=${COMFYUI_BUILD_REF}" >> ${GITHUB_ENV}

            base_tag="v2-cpu-${{ env.UBUNTU_VERSION }}"

            TAGS="${img_path_ghcr}:${base_tag}-${COMFYUI_BUILD_REF}"
            if [[ ${{ matrix.build.latest }} == "true" ]]; then
                echo "Marking latest"
                TAGS="${TAGS}, ${img_path_ghcr}:${base_tag}, ${img_path_ghcr}:latest-cpu"
            fi
            echo "TAGS=${TAGS}" >> ${GITHUB_ENV}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: build
          build-args: |
            IMAGE_BASE=ghcr.io/ai-dock/python:${{ matrix.build.python }}-v2-cpu-${{ env.UBUNTU_VERSION }}
            PYTHON_VERSION=${{ matrix.build.python }}
            PYTORCH_VERSION=${{ matrix.build.pytorch }}
            COMFYUI_BUILD_REF=${{ env.COMFYUI_BUILD_REF }}
          push: true
          # Avoids unknown/unknown architecture and extra metadata
          provenance: false
          tags: ${{ env.TAGS }}

  nvidia-base:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build:
          - {latest: "true", comfyui: "v0.33.1", python: "3.10", pytorch: "2.13.0", cuda: "12.4.1-base", torch_index: "cu130", pytorch_cuda: "13.0", torchvision: "0.28.0", torchaudio: "", xformers: ""}
          - {latest: "false", comfyui: "v0.33.1", python: "3.10", pytorch: "2.11.0", cuda: "12.4.1-base", torch_index: "cu128", pytorch_cuda: "12.8", torchvision: "0.26.0", torchaudio: "", xformers: ""}
          - {latest: "false", comfyui: "v0.26.2", python: "3.10", pytorch: "2.5.1", cuda: "12.1.1-base", torch_index: "", pytorch_cuda: "", torchvision: "0.20.1", torchaudio: "2.5.1", xformers: "0.0.28.post3"}
    steps:
      -
        name: Free Space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h
      -
        name: Env Setter
        run: |
          REPO=${GITHUB_REPOSITORY,,}
          echo "REPO_NAMESPACE=${REPO%%/*}" >> ${GITHUB_ENV}
          echo "REPO_NAME=${REPO#*/}" >> ${GITHUB_ENV}
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Permissions fixes
        run: |
          target="${HOME}/work/${{ env.REPO_NAME }}/${{ env.REPO_NAME }}/build/COPY*"
          chmod -R ug+rwX ${target}
      -
        name: Login to DockerHub
        if: ${{ vars.DOCKERHUB_USER != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Set tags
        run: |
            img_path_ghcr="ghcr.io/${{ env.REPO_NAMESPACE }}/${{ env.REPO_NAME }}"
            if [[ -z '${{ matrix.build.comfyui }}' ]]; then
                COMFYUI_BUILD_REF="$(curl -fsSL https://api.github.com/repos/Comfy-Org/ComfyUI/tags | jq -r '.[0].name')"
            else
                COMFYUI_BUILD_REF="${{ matrix.build.comfyui }}"
            fi
            [ -z "$COMFYUI_BUILD_REF" ] && { echo "Error: COMFYUI_BUILD_REF is empty. Exiting script." >&2; exit 1; }
            echo "COMFYUI_BUILD_REF=${COMFYUI_BUILD_REF}" >> ${GITHUB_ENV}

            base_tag="v2-cuda-${{ matrix.build.cuda }}-${{ env.UBUNTU_VERSION }}"
            # Disambiguate wheel-index variants sharing one base image
            if [[ -n '${{ matrix.build.torch_index }}' ]]; then
                base_tag="${base_tag}-${{ matrix.build.torch_index }}"
            fi

            # GHCR.io tags
            TAGS="${img_path_ghcr}:${base_tag}-${COMFYUI_BUILD_REF}"
            if [[ ${{ matrix.build.latest }} == "true" ]]; then
                echo "Marking latest"
                TAGS="${TAGS}, ${img_path_ghcr}:${base_tag}, ${img_path_ghcr}:latest, ${img_path_ghcr}:latest-cuda"
            fi

            # DockerHub tags only when credentials are configured (forks may not have them)
            if [[ -n "${{ vars.DOCKERHUB_USER }}" ]]; then
                img_path_dhub="${{ vars.DOCKERHUB_USER }}/${{ env.REPO_NAME }}-cuda"
                TAGS="${TAGS}, ${img_path_dhub}:${COMFYUI_BUILD_REF}"
                if [[ ${{ matrix.build.latest }} == "true" ]]; then
                    TAGS="${TAGS}, ${img_path_dhub}:latest"
                fi
                # Tag a devel build
                if [[ ${{ matrix.build.cuda }} = *-devel ]]; then
                    TAGS="${TAGS}, ${img_path_dhub}:${COMFYUI_BUILD_REF}-devel"
                fi
            fi
            echo "TAGS=${TAGS}" >> ${GITHUB_ENV}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: build
          build-args: |
            IMAGE_BASE=ghcr.io/ai-dock/python:${{ matrix.build.python }}-v2-cuda-${{ matrix.build.cuda }}-${{ env.UBUNTU_VERSION }}
            PYTHON_VERSION=${{ matrix.build.python }}
            PYTORCH_VERSION=${{ matrix.build.pytorch }}
            TORCH_INDEX=${{ matrix.build.torch_index }}
            PYTORCH_CUDA_VERSION=${{ matrix.build.pytorch_cuda }}
            TORCHVISION_VERSION=${{ matrix.build.torchvision }}
            TORCHAUDIO_VERSION=${{ matrix.build.torchaudio }}
            XFORMERS_VERSION=${{ matrix.build.xformers }}
            COMFYUI_BUILD_REF=${{ env.COMFYUI_BUILD_REF }}
          push: true
          provenance: false
          tags: ${{ env.TAGS }}

  # NOTE: AMD/ROCm job removed. The pinned rocm6.0 base image index
  # (download.pytorch.org/whl/rocm6.0) has no torch 2.5.1 wheels and the
  # ai-dock org no longer publishes updated ROCm bases. Reinstate only
  # alongside a base-image bump. NVIDIA CUDA is the supported target.
